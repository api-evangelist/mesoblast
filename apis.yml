aid: mesoblast

name: Mesoblast

description: 'Mesoblast Limited is an Australian regenerative medicine company headquartered in Melbourne,
  founded in 2004 by Silviu Itescu and listed on the ASX (MSB) and Nasdaq (MESO). It develops allogeneic cellular
  medicines based on mesenchymal lineage cells, including remestemcel-L for steroid-refractory acute graft versus
  host disease and rexlemestrocel-L for chronic heart failure and chronic low back pain. Its website answered our
  crawler with a bot challenge, and we found no public developer API or documentation.'

